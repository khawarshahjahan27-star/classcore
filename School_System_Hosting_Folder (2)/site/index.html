<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>School System</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0F766E">
<style>
:root{--brand:#0F766E;--ink:#14201C;--mut:#5B6B73;--line:#E3E8EC;--bg:#F3F5F7;--card:#fff;--bad:#B91C1C;--ok:#15803D}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.hide{display:none!important}
.mut{color:var(--mut)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
/* layout */
#app{display:flex;min-height:100vh}
#side{width:220px;background:#fff;border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
#main{flex:1;min-width:0}
#top{background:#fff;border-bottom:1px solid var(--line);padding:10px 18px;display:flex;gap:12px;align-items:center;position:sticky;top:0;z-index:5}
#view{padding:18px;max-width:1100px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 14px}
.brand img,.logo{width:40px;height:40px;border-radius:10px;object-fit:cover;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.brand b{display:block;line-height:1.2}
.brand small{color:var(--mut)}
.nav a{display:block;padding:9px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600;margin-bottom:2px}
.nav a:hover{background:var(--bg)}
.nav a.on{background:var(--brand);color:#fff}
.nav .soon{opacity:.45;cursor:default}
#menu{display:none}
/* ui */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.btn{padding:9px 14px;border-radius:10px;border:1px solid #C9D2D9;background:#fff;font-weight:600;cursor:pointer}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.p:hover{filter:brightness(.92)}
.btn.d{color:var(--bad);border-color:#F1B5B5}
.btn.s{padding:5px 10px;font-size:13px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid #C9D2D9;border-radius:10px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand)}
label.f{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-bottom:10px}
label.f>*:not(span){margin-top:4px;font-weight:400;color:var(--ink)}
label.chk{display:flex;gap:8px;align-items:center;margin:6px 0;font-weight:500}
label.chk input{width:auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font-size:26px;color:var(--brand)}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);background:#FAFBFC}
tr.click{cursor:pointer}
tr.click:hover{background:#F7FAFA}
.tw{overflow:auto;border:1px solid var(--line);border-radius:14px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--bg)}
.tag.ok{background:#DCFCE7;color:var(--ok)}
.tag.bad{background:#FEE2E2;color:var(--bad)}
.bar{height:10px;border-radius:6px;background:var(--brand);opacity:.85}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{padding:8px 14px;border-radius:99px;border:1px solid #C9D2D9;background:#fff;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.note{background:#F0FDFA;border:1px solid #B7E4DE;border-radius:12px;padding:10px 12px;font-size:14px}
.warn{background:#FFFBEB;border-color:#F3DFA2}
/* modal + toast */
#modal{position:fixed;inset:0;background:rgba(15,25,30,.5);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:50}
.mbox{background:#fff;border-radius:16px;width:100%;max-width:560px;padding:18px}
.mbox.w{max-width:780px}
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mhead h2{font-size:18px;flex:1}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#14201C;color:#fff;padding:10px 16px;border-radius:12px;z-index:99;max-width:90vw}
/* welcome */
.welcome{max-width:560px;margin:6vh auto;padding:0 14px}
.opt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.opt label{border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;display:block;font-weight:700}
.opt label small{display:block;font-weight:400;color:var(--mut)}
.opt input{width:auto;margin-right:6px}
.opt label:has(input:checked){border-color:var(--brand);background:#F0FDFA}
/* print */
#printarea{display:none}
@media print{
  body>*:not(#printarea){display:none!important}
  #printarea{display:block}
  body{background:#fff}
}
.cert{font-family:Georgia,serif;padding:30px;border:3px double #333;max-width:760px;margin:0 auto}
.cert h1{text-align:center;font-size:26px}
.cert .c{text-align:center}
.cert p{font-size:16px;line-height:2}
.cert .sig{display:flex;justify-content:space-between;margin-top:70px}
.cert .sig span{border-top:1px solid #000;padding-top:4px;min-width:160px;text-align:center;font-size:13px}
@media(max-width:800px){
  #side{position:fixed;left:-240px;z-index:20;transition:left .2s;box-shadow:0 0 30px rgba(0,0,0,.2)}
  #side.open{left:0}
  #menu{display:inline-block}
  .g2,.g3,.opt{grid-template-columns:1fr}
  #view{padding:12px}
}

/* slips */
.slipsheet{page-break-after:always;break-after:page}
.sliprow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5mm;margin:0 3px 6mm 0}
.slip{border:1px solid #222;padding:7px 9px;font-size:11px;line-height:1.35;color:#000;background:#fff}
.slipsheet.one .slip{font-size:13px;padding:10px 12px}
.slip h4{margin:0;font-size:1.15em;text-align:center}
.slip .cp{text-align:center;font-weight:700;border:1px solid #000;margin:4px 0;padding:1px;font-size:.9em}
.slip table{width:100%;border-collapse:collapse;margin:4px 0}
.slip td,.slip th{padding:2px 3px;border:1px solid #999;font-size:inherit;text-transform:none;letter-spacing:0;background:#fff;color:#000}
.slip .bank{border-top:1px dashed #555;margin-top:4px;padding-top:3px;font-size:.92em}
.slip .sg{margin-top:16px;display:flex;justify-content:space-between;font-size:.9em}
.slip .sg span{border-top:1px solid #000;padding-top:1px}
.slip .logo,.slip img{width:34px;height:34px;display:block;margin:0 auto 2px;border-radius:6px}

/* attendance */
.mk{display:flex;gap:6px}
.mk button{width:42px;height:38px;border-radius:10px;border:1px solid #C9D2D9;background:#fff;font-weight:700;cursor:pointer}
.mk button.P.on{background:#16A34A;border-color:#16A34A;color:#fff}
.mk button.A.on{background:#DC2626;border-color:#DC2626;color:#fff}
.mk button.L.on{background:#D97706;border-color:#D97706;color:#fff}
.reg{border-collapse:collapse;font-size:12px}
.reg td,.reg th{border:1px solid #D5DCE1;padding:2px 4px;text-align:center;min-width:22px}
.reg td.nm{text-align:left;white-space:nowrap;min-width:140px}
.reg .A{color:#DC2626;font-weight:700}.reg .L{color:#D97706;font-weight:700}.reg .H{background:#EEF1F3;color:#999}

</style>
</head>
<body>
<div id="welcome" class="welcome hide"></div>
<div id="app" class="hide">
  <aside id="side">
    <div class="brand" id="brand"></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div id="main">
    <div id="top"><button class="btn s" id="menu" type="button">Menu</button><div id="switch"></div><div class="sp"></div><button class="btn s hide" id="lockBtn" type="button" data-a="lockNow">Lock</button><button class="btn s" id="syncChip" type="button" data-a="syncChip">Saved on this device</button></div>
    <div id="view"></div>
  </div>
</div>
<div id="modal" class="hide"></div>
<div id="toast" class="hide"></div>
<div id="printarea"></div>
<script>
// ===== CORE: storage, helpers, router, modal. Every other chunk uses these. =====
var APP = { mods: [], act: {}, forms: {}, VERSION: 1 };
var DB = null;
var KEY = 'sams_school_db_v1';

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function $(id) { return document.getElementById(id); }
function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function fmtDate(s) { if (!s) return ''; var p = s.split('-'); return p.length === 3 ? p[2] + '-' + p[1] + '-' + p[0] : s; }

// ---- storage: IndexedDB (big, safe). Old localStorage data is moved over once. ----
var idb = null, saveT = null, idbOK = true;
function emptyDB() { return { v: 1, active: null, schools: {} }; }
function openIdb(cb) {
  try {
    var r = indexedDB.open('sams_school', 1);
    r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
    r.onsuccess = function () { idb = r.result; cb(); };
    r.onerror = function () { idbOK = false; cb(); };
  } catch (e) { idbOK = false; cb(); }
}
function load(done) {
  function legacy() { var d = null; try { d = JSON.parse(localStorage.getItem(KEY)); } catch (e) { } return d; }
  function fin(d) { DB = d && d.schools ? d : emptyDB(); if (idbOK && !d) { /* nothing */ } done(); }
  openIdb(function () {
    if (!idbOK) return fin(legacy());
    var q = idb.transaction('kv').objectStore('kv').get('db');
    q.onsuccess = function () { var d = q.result; if (!d) { d = legacy(); if (d) { DB = d; flushSave(); } } fin(d); };
    q.onerror = function () { idbOK = false; fin(legacy()); };
  });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
}
function flushSave() {
  clearTimeout(saveT); saveT = null; if (!DB) return;
  if (idbOK && idb) {
    try { var tx = idb.transaction('kv', 'readwrite'); tx.objectStore('kv').put(DB, 'db'); tx.onerror = function () { toast('Could not save. Download a backup now.'); }; return; } catch (e) { }
  }
  try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) { toast('Could not save. Storage may be full. Download a backup now.'); }
}
function save() { if (saveT) clearTimeout(saveT); saveT = setTimeout(flushSave, 60); if (APP.onSave) APP.onSave(); }
// small key-value helpers (used by online sync to keep login and versions OUTSIDE the school data)
function kvGet(k, cb) {
  if (idbOK && idb) { try { var q = idb.transaction('kv').objectStore('kv').get(k); q.onsuccess = function () { cb(q.result || null); }; q.onerror = function () { cb(null); }; return; } catch (e) { } }
  var v = null; try { v = JSON.parse(localStorage.getItem('sams_kv_' + k)); } catch (e) { } cb(v);
}
function kvPut(k, v) {
  if (idbOK && idb) { try { idb.transaction('kv', 'readwrite').objectStore('kv').put(v, k); return; } catch (e) { } }
  try { localStorage.setItem('sams_kv_' + k, JSON.stringify(v)); } catch (e) { }
}
window.addEventListener('pagehide', function () { if (saveT) flushSave(); });
document.addEventListener('visibilitychange', function () { if (document.hidden && saveT) flushSave(); });
function S() { return DB.schools[DB.active]; }           // the active school
function schoolList() { return Object.keys(DB.schools).map(function (k) { return DB.schools[k]; }); }

// ---- default settings by school type ----
function newSchool(p) {
  var gov = p.type === 'government';
  var cls = gov ? ['Katchi', 'Class 1', 'Class 2', 'Class 3', 'Class 4', 'Class 5', 'Class 6', 'Class 7', 'Class 8', 'Class 9', 'Class 10']
                : ['Play Group', 'Nursery', 'Prep', 'Class 1', 'Class 2', 'Class 3', 'Class 4', 'Class 5', 'Class 6', 'Class 7', 'Class 8', 'Class 9', 'Class 10'];
  return {
    id: uid(),
    profile: { name: p.name, type: p.type, city: p.city || '', address: '', phone: p.phone || '', email: '', motto: '', color: p.color || '#0F766E', logo: '', principal: '', year: String(new Date().getFullYear()) },
    settings: {
      admLabel: gov ? 'GR No' : 'Admission No',       // government schools call it GR / register number
      admAuto: true, admPrefix: '', admNext: 1, admPad: 4,
      feesOn: !gov,                                    // private: fees on. government: usually off
      fields: { bForm: true, fatherCnic: false, religion: false, address: true, prevSchool: true, bloodGroup: false, whatsapp: true, notes: true, domicile: gov, disability: gov }
    },
    classes: cls.map(function (n) { return { id: uid(), name: n, sections: ['A'] }; }),
    students: []
  };
}

// ---- UI helpers ----
var toastT;
function toast(msg) {
  var t = $('toast'); t.textContent = msg; t.classList.remove('hide');
  clearTimeout(toastT); toastT = setTimeout(function () { t.classList.add('hide'); }, 2600);
}
function modal(title, html, wide) {
  var m = $('modal');
  m.innerHTML = '<div class="mbox' + (wide ? ' w' : '') + '"><div class="mhead"><h2>' + esc(title) + '</h2><button class="btn s" data-a="close">Close</button></div>' + html + '</div>';
  m.classList.remove('hide');
}
function closeModal() { $('modal').classList.add('hide'); $('modal').innerHTML = ''; }
function ask(msg) { return window.confirm(msg); }
function printHtml(html, landscape) {
  $('printarea').innerHTML = html;
  var st = $('pgstyle'); if (st) st.remove();
  st = document.createElement('style'); st.id = 'pgstyle'; st.textContent = '@page{size:A4 ' + (landscape ? 'landscape' : 'portrait') + ';margin:8mm}'; document.head.appendChild(st);
  setTimeout(function () { window.print(); }, 80);
}
function money(n) { n = Math.round(Number(n) || 0); return (n < 0 ? '-' : '') + 'Rs ' + Math.abs(n).toLocaleString('en-US'); }
var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function monthLabel(m) { var p = m.split('-'); return MONTHS[parseInt(p[1], 10) - 1] + ' ' + p[0]; }
function thisMonth() { return today().slice(0, 7); }
function waLink(num, msg) {
  var d = String(num || '').replace(/\D/g, ''); if (!d) return '';
  if (d.indexOf('00') === 0) d = d.slice(2); else if (d.charAt(0) === '0') d = '92' + d.slice(1); else if (d.length === 10) d = '92' + d;
  return 'https://wa.me/' + d + '?text=' + encodeURIComponent(msg);
}
function download(name, text, type) {
  var b = new Blob([text], { type: type || 'text/plain' }), a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function formData(form) {
  var o = {}; Array.prototype.forEach.call(form.elements, function (el) {
    if (!el.name) return;
    if (el.type === 'checkbox') o[el.name] = el.checked;
    else if (el.type === 'radio') { if (el.checked) o[el.name] = el.value; }
    else o[el.name] = el.value.trim();
  }); return o;
}
function opt(list, sel, valKey, labKey) {
  return list.map(function (x) {
    var v = valKey ? x[valKey] : x, l = labKey ? x[labKey] : x;
    return '<option value="' + esc(v) + '"' + (String(v) === String(sel) ? ' selected' : '') + '>' + esc(l) + '</option>';
  }).join('');
}
function classById(id) { return S().classes.filter(function (c) { return c.id === id; })[0]; }
function className(id) { var c = classById(id); return c ? c.name : '—'; }

// ---- module registry + router ----
// A chunk registers itself:  APP.mods.push({id:'students', label:'Students', order:20, render:function(){return html}, after:function(){}})
function mod(id) { return APP.mods.filter(function (m) { return m.id === id; })[0]; }
function schoolChanged() { (APP.onSchool || []).forEach(function (f) { f(); }); }
function route() {
  var id = (location.hash || '#/home').replace('#/', '').split('?')[0];
  var m = mod(id) || mod('home');
  if (!DB.active) return showWelcome();
  if (APP.gate) { var g = APP.gate(id); if (g === 'lock') return; if (g) { if (location.hash !== '#/' + g) location.hash = '#/' + g; else route(); return; } }
  $('welcome').classList.add('hide'); $('welcome').innerHTML = ''; $('app').classList.remove('hide');
  applyBrand(); drawNav(m.id);
  $('view').innerHTML = m.render();
  if (m.after) m.after();
  $('side').classList.remove('open');
  window.scrollTo(0, 0);
  if (APP.afterRoute) APP.afterRoute();
}
function rerender() { var y = window.scrollY; route(); window.scrollTo(0, y); }
function go(id) { if (location.hash === '#/' + id) route(); else location.hash = '#/' + id; }

function drawNav(cur) {
  var items = APP.mods.filter(function (m) { return !m.hidden && (!m.when || m.when()) && (!APP.canSee || APP.canSee(m.id)); }).sort(function (a, b) { return a.order - b.order; });
  var h = items.map(function (m) { return '<a href="#/' + m.id + '" class="' + (m.id === cur ? 'on' : '') + '">' + esc(m.label) + '</a>'; }).join('');
  (APP.soon || []).filter(function (x) { return !APP.mods.some(function (m) { return m.label === x; }); }).forEach(function (x) { h += '<a class="soon" title="Coming in a later chunk">' + esc(x) + '</a>'; });
  $('nav').innerHTML = h;
}
function applyBrand() {
  var s = S(); document.documentElement.style.setProperty('--brand', s.profile.color || '#0F766E');
  var init = (s.profile.name || '?').trim().charAt(0).toUpperCase();
  var logo = s.profile.logo ? '<img src="' + s.profile.logo + '" alt="">' : '<div class="logo">' + esc(init) + '</div>';
  $('brand').innerHTML = logo + '<div><b>' + esc(s.profile.name) + '</b><small>' + (s.profile.type === 'government' ? 'Government school' : 'Private school') + '</small></div>';
  var sw = schoolList().length > 1;
  $('switch').innerHTML = '';
  if (sw) { $('switch').innerHTML = '<select id="schoolSwitch">' + schoolList().map(function (x) { return '<option value="' + x.id + '"' + (x.id === DB.active ? ' selected' : '') + '>' + esc(x.profile.name) + '</option>'; }).join('') + '</select>'; }
  document.title = s.profile.name + ' – School System';
}

// ---- welcome screen: create the first school ----
function showWelcome(adding) {
  $('app').classList.add('hide');
  var w = $('welcome'); w.classList.remove('hide');
  w.innerHTML = '<div class="card"><h1>' + (adding ? 'Add another school' : 'Welcome') + '</h1>' +
    '<p class="mut">Set up your school in one minute. You can change everything later in Settings.</p>' +
    '<form data-f="newSchool">' +
    '<label class="f"><span>School name</span><input name="name" required placeholder="e.g. Al-Noor Public School"></label>' +
    '<div class="opt"><label><input type="radio" name="type" value="private" checked>Private<small>Monthly fees, salaries, fee slips</small></label>' +
    '<label><input type="radio" name="type" value="government">Government<small>GR number, no fees by default</small></label></div>' +
    '<div class="g2"><label class="f"><span>City</span><input name="city"></label><label class="f"><span>Phone</span><input name="phone"></label></div>' +
    '<label class="f"><span>School colour</span><input type="color" name="color" value="#0F766E" style="height:42px;padding:3px"></label>' +
    '<div class="row"><button class="btn p" type="submit">Create school</button>' + (adding ? '<button class="btn" type="button" data-a="cancelAdd">Cancel</button>' : '') + '</div></form></div>' +
    (adding ? '' : '<div class="note">Data is saved on this device in your browser. Use Settings → Backup often.</div>');
}
APP.forms.newSchool = function (f) {
  var d = formData(f); if (!d.name) return;
  var s = newSchool(d); DB.schools[s.id] = s; DB.active = s.id; save(); location.hash = '#/home'; route(); toast('School created');
};
APP.act.cancelAdd = function () { route(); };
APP.act.close = closeModal;

// ---- global events ----
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-a]');
  if (el && APP.act[el.getAttribute('data-a')]) { APP.act[el.getAttribute('data-a')](el, e); }
  else if (e.target.id === 'modal') closeModal();
});
document.addEventListener('submit', function (e) {
  var f = e.target.closest('form[data-f]');
  if (f) { e.preventDefault(); if (APP.forms[f.getAttribute('data-f')]) APP.forms[f.getAttribute('data-f')](f, e); }
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'schoolSwitch') { DB.active = e.target.value; schoolChanged(); save(); location.hash = '#/home'; route(); }
  var c = e.target.closest('[data-c]'); if (c && APP.chg && APP.chg[c.getAttribute('data-c')]) APP.chg[c.getAttribute('data-c')](c, e);
});
document.addEventListener('input', function (e) {
  var c = e.target.closest('[data-i]'); if (c && APP.inp && APP.inp[c.getAttribute('data-i')]) APP.inp[c.getAttribute('data-i')](c, e);
});
window.addEventListener('hashchange', route);


// ===== CHUNK 1b: Home (dashboard) + Settings (profile, branding, classes, fields, numbering, backup) =====
APP.soon = [];
APP.homeCards = []; // each chunk can add a small number card: function(){ return {label, value} }

// ---------- HOME ----------
APP.mods.push({
  id: 'home', label: 'Home', order: 1,

APP.chg.logo = function (el) {
  var file = el.files[0]; if (!file) return;
  var r = new FileReader();
  r.onload = function () {
    var img = new Image();
    img.onload = function () {
      var max = 200, k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      S().profile.logo = c.toDataURL('image/png'); save(); rerender(); toast('Logo saved');
    };
    img.onerror = function () { toast('That file is not a picture.'); };
    img.src = r.result;
  };
  r.readAsDataURL(file);
};

APP.forms.saveClasses = function (f) {
  var s = S(), lines = formData(f).txt.split('\n').map(function (l) { return l.trim(); }).filter(Boolean), out = [], seen = {};
  for (var i = 0; i < lines.length; i++) {
    var parts = lines[i].split('|'), name = parts[0].trim(); if (!name) continue;
    if (seen[name.toLowerCase()]) { toast('Class "' + name + '" is listed twice.'); return; }
    seen[name.toLowerCase()] = 1;
    var secs = (parts[1] || 'A').split(',').map(function (x) { return x.trim(); }).filter(Boolean); if (!secs.length) secs = ['A'];
    var old = s.classes.filter(function (c) { return c.name.toLowerCase() === name.toLowerCase(); })[0];
    out.push({ id: old ? old.id : uid(), name: name, sections: secs });
  }
  if (!out.length) { toast('Add at least one class.'); return; }
  for (var j = 0; j < s.classes.length; j++) {
    var oc = s.classes[j], kept = out.filter(function (c) { return c.id === oc.id; })[0];
    var users = s.students.filter(function (x) { return x.status === 'active' && x.classId === oc.id; });
    if (!kept && users.length) { toast('"' + oc.name + '" still has ' + users.length + ' active students.'); return; }
    if (kept) {
      var bad = users.filter(function (x) { return kept.sections.indexOf(x.section) < 0; });
      if (bad.length) { toast('Section "' + bad[0].section + '" of ' + oc.name + ' still has students.'); return; }
    }
  }
  s.classes = out; save(); rerender(); toast('Classes saved');
};

APP.chg.restore = function (el) {
  var file = el.files[0]; if (!file) return;
  var r = new FileReader();
  r.onload = function () {
    try {
      var d = JSON.parse(r.result); if (!d || !d.schools || typeof d.schools !== 'object') throw 0;
      if (!ask('Replace ALL data on this device with this backup?')) return;
      DB = d; if (!DB.schools[DB.active]) DB.active = Object.keys(DB.schools)[0] || null; save(); if (APP.restored) APP.restored(); location.hash = '#/home'; route(); toast('Backup restored');
    } catch (e) { toast('That is not a valid backup file.'); }
  };
  r.readAsText(file);
};

var CSV_COLS = ['admNo', 'name', 'fatherName', 'gender', 'dob', 'class', 'section', 'phone', 'whatsapp', 'bForm', 'admissionDate', 'status'];
function csvCell(v) { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
APP.act.exportCsv = function () {
  var rows = [CSV_COLS.join(',')];
  S().students.forEach(function (x) { rows.push(CSV_COLS.map(function (c) { return csvCell(c === 'class' ? className(x.classId) : x[c]); }).join(',')); });
  download('students-' + today() + '.csv', '﻿' + rows.join('\r\n'), 'text/csv'); toast('Exported ' + S().students.length + ' students');
};
function parseCsv(t) {
  var rows = [], row = [], cur = '', q = false, i, c;
  t = t.replace(/^﻿/, '');
  for (i = 0; i < t.length; i++) {
    c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ',' || c === '\t') { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(function (r) { return r.some(function (v) { return v.trim(); }); });
}
function normDate(v) {
  v = (v || '').trim(); if (!v) return '';
  var m = v.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/); if (m) return m[1] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[3]).slice(-2);
  m = v.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/); if (m) return m[3] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[1]).slice(-2);
  return null;
}

// ---------- calculations ----------
function money2(n) { return money(n); }
function ledgerMaps() { // totals per student, fast for 1500 students
  var f = FS(), m = {};
  function g(id) { return m[id] || (m[id] = { ch: 0, pay: 0 }); }
  f.charges.forEach(function (c) { g(c.stuId).ch += c.amount; });
  f.payments.forEach(function (p) { g(p.stuId).pay += p.amount; });
  return m;
}
function balanceOf(id, maps) { var x = (maps || ledgerMaps())[id]; return x ? x.ch - x.pay : 0; }
function chargesBefore(id, month) { return FS().charges.filter(function (c) { return c.stuId === id && c.month < month; }).reduce(function (a, c) { return a + c.amount; }, 0); }
function paidTotal(id) { return FS().payments.filter(function (p) { return p.stuId === id; }).reduce(function (a, p) { return a + p.amount; }, 0); }
function discountOf(x, fee) {
  var d = x.feeDisc; if (!d || !d.value) return 0;
  var v = d.type === 'percent' ? Math.round(fee * d.value / 100) : Number(d.value);
  return Math.min(fee, Math.max(0, v));
}

// ===== CHUNK 8: ONLINE SYNC (Supabase over plain web calls, no library) =====
// Local-first: the app always works offline from the device database. When signed in and online, each school is
// copied to the cloud (one row per school, protected by row-level security) and pulled on other devices.
// Each school has a version number (rev). A save only succeeds if the cloud still has the version we last saw,
// so two devices can never silently overwrite each other: a conflict screen appears instead.
var SY = { cfg: null, ses: null, del: [], state: 'local', last: '', busy: false, timer: null, msg: '', conflicts: [] };

function meta(s) { if (!s.sync) s.sync = { rev: 0, dirty: true, v: 1 }; return s.sync; }
function hasSync() { return !!(SY.cfg && SY.cfg.url && SY.cfg.key && SY.ses); }
function base() { return SY.cfg.url.replace(/\/+$/, ''); }
function nowSec() { return Math.floor(Date.now() / 1000); }

function http(path, o) {
  o = o || {};

  if (o.token) h.Authorization = 'Bearer ' + o.token;   // only the signed-in user's token; the project key goes in apikey ONLY (new publishable keys are not tokens)
  if (o.prefer) h.Prefer = o.prefer;
  return fetch(base() + path, { method: o.method || 'GET', headers: h, body: o.body ? JSON.stringify(o.body) : undefined }).then(function (r) {
    return r.text().then(function (t) { var j = null; try { j = t ? JSON.parse(t) : null; } catch (e) { } return { ok: r.ok, status: r.status, json: j }; });
  });
}
function errText(r) { var j = r.json || {}; return j.msg || j.error_description || j.message || j.error || ('Error ' + r.status); }

// ---------- status chip ----------
function chip(state, text) {

}
function updateChip() {

  if (SY.conflicts.length) return chip('conflict', 'Needs attention');
  if (SY.busy) return chip('syncing', 'Syncing…');
  if (SY.state === 'offline') return chip('offline', 'Offline – will sync later');
  if (SY.state === 'error') return chip('error', 'Sync problem');

function hhmm() { var d = new Date(); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }

// ---------- login session ----------
function setSession(j) {

  kvPut('sync_ses', SY.ses);
}
function dropSession() { SY.ses = null; kvPut('sync_ses', null); }
function token() {

    r.json.user = r.json.user || { id: SY.ses.uid, email: SY.ses.email }; setSession(r.json); return SY.ses.access_token;

// ---------- pull ----------

// ---------- push ----------
function push() {

// ---------- run ----------
function syncNow(manual) {

  if (SY.busy) return Promise.resolve(); SY.busy = true; updateChip();
  return pull().then(function (changed) { return push().then(function () { return changed; }); }).then(function (changed) {
    SY.state = 'ok'; SY.msg = ''; SY.last = hhmm(); flushSave();
    if (changed) refreshAfterPull();

    if (e && e.login) { SY.state = 'local'; SY.msg = 'Please sign in again.'; if (manual) toast(SY.msg); }
    else if (e instanceof TypeError) { SY.state = 'offline'; SY.msg = 'No internet or wrong server address.'; if (manual) toast('Could not reach the server. Your data is safe on this device.'); }
    else { SY.state = 'error'; SY.msg = (e && e.text) || 'Something went wrong.'; if (manual) toast(SY.msg); }
  }).then(function () { SY.busy = false; updateChip(); if (setTab === 'sync' && location.hash === '#/settings') rerender(); });

['click', 'keydown', 'touchstart'].forEach(function (ev) { document.addEventListener(ev, function () { lastAct = Date.now(); }, true); });
setInterval(function () { var a = AC(); if (a && a.idle && curRole() && Date.now() - lastAct > a.idle * 60000) { setRole(''); closeModal(); route(); } }, 15000);

// ---------- lock screen ----------
function showLock() {

  var head = '<div class="card" style="text-align:center">' + (pr.logo ? '<img src="' + pr.logo + '" style="width:64px;height:64px;border-radius:14px;object-fit:cover">' : '<div class="logo" style="width:64px;height:64px;font-size:26px;margin:0 auto">' + esc(pr.name.charAt(0).toUpperCase()) + '</div>') + '<h1 style="margin:8px 0 2px">' + esc(pr.name) + '</h1>';

      '<label class="f"><span>New Principal PIN (4 to 8 digits)</span><input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" required></label><div class="row"><button class="btn p" type="submit">Reset PIN</button><button class="btn" type="button" data-a="lockBack">Back</button></div></form></div>';

    '<div class="row" style="justify-content:center"><button class="btn p" type="submit">Unlock</button><button class="btn" type="button" data-a="lockBack">Back</button></div></form><p style="margin-top:14px"><a href="#" data-a="lockForgot">Forgot PIN?</a></p></div>';

APP.act.lockPick = function (el) { lockStage.role = el.getAttribute('data-id'); showLock(); };

};
APP.forms.recover = function (f) {

// ---------- settings tab ----------
TABS.access = function () {
  var a = AC();
  if (!a) return '<div class="card"><h3 style="margin-bottom:6px">Staff access is OFF</h3><p class="mut" style="margin-top:0">Right now anyone who opens the app can see everything, including fees and salaries. Turn this on to ask for a PIN when the app opens, and let each role see only its own pages (a teacher sees Attendance, Exams, Diary and Leave; the accountant sees Fees).</p>' +
    '<form data-f="accOn"><div class="g2"><label class="f"><span>Principal PIN (4 to 8 digits)</span><input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" required></label><label class="f"><span>Repeat PIN</span><input name="pin2" type="password" inputmode="numeric" pattern="[0-9]{4,8}" required></label></div><button class="btn p" type="submit">Turn on staff access</button></form></div>' +
    '<div class="note warn">This keeps casual users out of pages. It is not bank-level security. Someone with technical skill and the device could still reach the data. Keep the device itself safe.</div>';
  var r0 = curRole(); if (!r0 || !r0.settings) return '<div class="card mut">Only roles allowed to open Settings can change access.</div>';

    '<form data-f="accIdle" class="row" style="margin-top:8px"><label class="f" style="margin:0"><span>Lock automatically after (minutes of no use, 0 = never)</span><input type="number" min="0" max="240" name="idle" value="' + (a.idle || 0) + '" style="max-width:140px"></label><button class="btn" type="submit">Save</button></form></div>' +
    a.roles.map(function (r) {

        '<label class="f"><span>' + (r.pinHash ? 'Change PIN (leave empty to keep)' : 'Set PIN (this role cannot unlock until a PIN is set)') + '</span><input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" placeholder="4 to 8 digits"></label></div>' +
        (fixed ? '<p class="mut" style="margin:0 0 8px">The Principal can open everything, including Settings.</p>' :

        '<div class="row"><button class="btn p" type="submit">Save</button>' + (fixed ? '' : '<button class="btn d s" type="button" data-a="accDel" data-id="' + r.id + '">Delete role</button>') + '</div></form></div>';

function newRole(id, name, mods, settings, pin) { var salt = rnd(10, 'abcdefghijklmnopqrstuvwxyz0123456789'); return { id: id, name: name, mods: mods, settings: !!settings, salt: salt, pinHash: pin ? pinHash(pin, salt) : '' }; }

};
APP.forms.accRole = function (f) {
  var d = formData(f), a = AC(), r = a.roles.filter(function (x) { return x.id === d.id; })[0];
